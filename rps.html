<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rps.css" />
    <script src="RPS.js" defer></script>
</head>
<body>

    <div class="game-area">
        <div class="zone rock" data-choice="rock" title="Rock"></div>
        <div class="zone paper" data-choice="paper" title="Paper"></div>
        <div class="zone scissors" data-choice="scissors" title="Scissors"></div>
    </div>

    <div class="results">
        <div id="player-choice"></div>
        <div id="computer-choice"></div>
        <div id="final-result"></div>
    </div>

</body>
</html>
